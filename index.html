<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="PasswordForge — генератор и проверка надёжности паролей.">
  <title>PasswordForge</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header>
      <div class="logo">⚡ PasswordForge</div>
      <span class="badge">LOCAL • PRIVATE</span>
    </header>

    <section class="hero">
      <p class="eyebrow">SECURITY TOOL</p>
      <h1>Создай пароль,<br><span>который не угадают.</span></h1>
      <p class="sub">Генерация и локальная проверка паролей. Ничего не отправляется на сервер.</p>
    </section>

    <section class="panel">
      <div class="password-row">
        <input id="password" type="text" autocomplete="off" spellcheck="false" aria-label="Пароль">
        <button id="copy" class="copy" type="button">COPY</button>
      </div>

      <div class="strength">
        <div class="strength-top"><span>Надёжность</span><strong id="strengthText">—</strong></div>
        <div class="meter"><i id="meter"></i></div>
        <p id="hint">Сгенерируй пароль или введи свой.</p>
      </div>

      <div class="controls">
        <label>Длина <output id="lengthValue">20</output>
          <input id="length" type="range" min="8" max="64" value="20">
        </label>
        <div class="checks">
          <label><input id="lower" type="checkbox" checked> a-z</label>
          <label><input id="upper" type="checkbox" checked> A-Z</label>
          <label><input id="numbers" type="checkbox" checked> 0-9</label>
          <label><input id="symbols" type="checkbox" checked> #$%</label>
        </div>
      </div>

      <button id="generate" class="generate" type="button">СГЕНЕРИРОВАТЬ ПАРОЛЬ <span>↗</span></button>
    </section>

    <footer>Работает полностью в браузере · Без регистрации · Без трекинга</footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
